version: '3.8'

services:
  # Demo Source Database 1: E-commerce database
  demo-source-1:
    container_name: demo-source-1
    image: postgres:18-alpine@sha256:48c8ad3a7284b82be4482a52076d47d879fd6fb084a1cbfccbd551f9331b0e40
    command: ["postgres", "-c", "wal_level=logical", "-c", "max_replication_slots=4", "-c", "max_wal_senders=4"]
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ecommerce
    ports:
      - "5433:5432"
    volumes:
      - demo-source-1-data:/var/lib/postgresql/data
      - ./init-scripts/ecommerce.sql:/docker-entrypoint-initdb.d/01-ecommerce.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Demo Source Database 2: Analytics database
  demo-source-2:
    container_name: demo-source-2
    image: postgres:18-alpine@sha256:48c8ad3a7284b82be4482a52076d47d879fd6fb084a1cbfccbd551f9331b0e40
    command: ["postgres", "-c", "wal_level=logical", "-c", "max_replication_slots=4", "-c", "max_wal_senders=4"]
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: analytics
    ports:
      - "5434:5432"
    volumes:
      - demo-source-2-data:/var/lib/postgresql/data
      - ./init-scripts/analytics.sql:/docker-entrypoint-initdb.d/01-analytics.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Demo Destination Database: Data Warehouse
  demo-dest:
    container_name: demo-dest
    image: postgres:18-alpine@sha256:48c8ad3a7284b82be4482a52076d47d879fd6fb084a1cbfccbd551f9331b0e40
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: warehouse
    ports:
      - "5435:5432"
    volumes:
      - demo-dest-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  demo-source-1-data:
  demo-source-2-data:
  demo-dest-data:

networks:
  default:
    name: peerdb_network
    external: true

